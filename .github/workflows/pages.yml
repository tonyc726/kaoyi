name: pages

on:
  push:
    branches: [main]
  schedule:
    # Every 3 hours UTC = 02/05/08/11/14/17/20/23 Asia/Shanghai
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      # GITHUB_TOKEN data commits do not retrigger this workflow.
      # Fetch, then build/deploy from this same workspace.
      - name: Fetch official prices
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TZ: Asia/Shanghai
        run: uv run python scripts/fetch.py

      - name: Commit data artifacts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/snapshots data/events data/official-posts data/fetch-status.json data/scores.json
          if git diff --cached --quiet; then
            echo "No data artifacts to commit"
            exit 0
          fi
          git commit -m "data: official prices and derived scores"
          git push

      - name: Build static site
        run: uv run python scripts/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
